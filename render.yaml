services:
  - type: web
    name: englishsentence-toss-api
    runtime: node
    plan: free
    rootDir: ocr-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: ALLOWED_ORIGIN
        value: https://englishsentence-toss.onrender.com
      - key: APP_TIME_ZONE
        value: Asia/Seoul
      - key: DATA_DIR
        value: /tmp/englishsentence-data

  - type: web
    name: englishsentence-toss
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://englishsentence-toss-api.onrender.com
